---
- name: Ensure discovery output directory exists
  ansible.builtin.file:
    path: "{{ denodo_runtime_root }}/discovery"
    state: directory
    mode: "0755"

- name: Run installer discovery script
  ansible.builtin.command:
    cmd: >-
      {{ playbook_dir }}/../scripts/discover_installer.sh
      {{ denodo_installer_zip_path }}
      {{ denodo_runtime_root }}/discovery
  changed_when: false

- name: Show discovery report location
  ansible.builtin.debug:
    msg: "Installer discovery report: {{ denodo_runtime_root }}/discovery/INSTALLER_DISCOVERY_REPORT.md"
