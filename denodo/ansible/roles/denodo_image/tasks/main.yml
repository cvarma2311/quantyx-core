---
- name: Ensure installer zip exists
  ansible.builtin.stat:
    path: "{{ denodo_installer_zip_path }}"
  register: installer_zip

- name: Fail if installer zip is missing
  ansible.builtin.assert:
    that:
      - installer_zip.stat.exists
      - installer_zip.stat.isreg
    fail_msg: "Installer zip not found at {{ denodo_installer_zip_path }}"

- name: Create Docker build context directory
  ansible.builtin.file:
    path: "{{ denodo_build_context }}"
    state: directory
    mode: "0755"

- name: Auto-detect installer script in zip (prefer installer_cli.sh)
  ansible.builtin.shell: |
    set -euo pipefail
    script="$(unzip -Z1 "{{ denodo_installer_zip_path }}" | awk '/\/installer_cli\.sh$/ {print; exit}')"
    if [ -z "$script" ]; then
      script="$(unzip -Z1 "{{ denodo_installer_zip_path }}" | awk '/\/install\.sh$/ {print; exit}')"
    fi
    printf "%s" "$script"
  args:
    executable: /bin/bash
  register: installer_script_detection
  changed_when: false
  failed_when: false

- name: Set detected installer script
  ansible.builtin.set_fact:
    denodo_detected_installer_script: "{{ installer_script_detection.stdout | default('') | trim }}"
  when: denodo_auto_detect_installer_script | bool

- name: Resolve effective installer script
  ansible.builtin.set_fact:
    denodo_effective_installer_script: >-
      {{
        (denodo_installer_script | trim)
        if (denodo_installer_script | trim | length > 0)
        else (denodo_detected_installer_script | default(''))
      }}

- name: Resolve effective install root
  ansible.builtin.set_fact:
    denodo_effective_install_root: >-
      {{
        (denodo_install_root | trim)
        if (denodo_install_root | trim | length > 0)
        else ((denodo_effective_installer_script | dirname) if (denodo_effective_installer_script | length > 0) else '')
      }}

- name: Assert installer script exists in zip when execution is enabled
  ansible.builtin.assert:
    that:
      - denodo_effective_installer_script | length > 0
    fail_msg: >-
      Could not resolve installer script in zip. Set denodo_installer_script explicitly.
  when: denodo_run_installer_during_build | bool

- name: Check response file presence
  ansible.builtin.stat:
    path: "{{ denodo_response_file_path }}"
  register: denodo_response_file_stat
  when: denodo_response_file_path | trim | length > 0

- name: Copy response file into build context
  ansible.builtin.copy:
    src: "{{ denodo_response_file_path }}"
    dest: "{{ denodo_build_context }}/{{ denodo_response_file_path | basename }}"
    mode: "0644"
    remote_src: true
  when:
    - denodo_response_file_path | trim | length > 0
    - denodo_response_file_stat.stat.exists
    - denodo_response_file_stat.stat.isreg

- name: Resolve effective installer flags
  ansible.builtin.set_fact:
    denodo_effective_installer_flags: >-
      {{
        (denodo_installer_flags | trim)
        if (denodo_installer_flags | trim | length > 0)
        else (
          'install --autoinstaller /tmp/denodo-installer/' ~ (denodo_response_file_path | basename)
          if (
            denodo_response_file_path | trim | length > 0
            and denodo_response_file_stat is defined
            and denodo_response_file_stat.stat.exists
          )
          else ''
        )
      }}

- name: Copy installer zip into build context
  ansible.builtin.copy:
    src: "{{ denodo_installer_zip_path }}"
    dest: "{{ denodo_build_context }}/denodo-express-install-9-linux64.zip"
    mode: "0644"
    remote_src: true

- name: Render Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ denodo_build_context }}/Dockerfile"
    mode: "0644"

- name: Build Denodo Docker image
  community.docker.docker_image:
    name: "{{ denodo_image_name }}"
    tag: "{{ denodo_image_tag }}"
    source: build
    build:
      path: "{{ denodo_build_context }}"
      pull: true
      nocache: "{{ denodo_force_rebuild | bool }}"
      args:
        DENODO_INSTALLER_SCRIPT: "{{ denodo_effective_installer_script }}"
        DENODO_INSTALLER_FLAGS: "{{ denodo_effective_installer_flags | default('') }}"
        DENODO_INSTALL_ROOT: "{{ denodo_effective_install_root }}"
        DENODO_RUN_INSTALLER_DURING_BUILD: "{{ 'true' if (denodo_run_installer_during_build | bool) else 'false' }}"
    force_source: "{{ denodo_force_rebuild | bool }}"
