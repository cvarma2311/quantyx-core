---
- name: Ensure installable directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../installable"
    state: directory
    mode: "0755"

- name: Ensure installer zip exists before generating response file
  ansible.builtin.stat:
    path: "{{ denodo_installer_zip_path }}"
  register: denodo_installer_zip_stat

- name: Fail when installer zip is missing
  ansible.builtin.assert:
    that:
      - denodo_installer_zip_stat.stat.exists
      - denodo_installer_zip_stat.stat.isreg
    fail_msg: "Installer zip not found at {{ denodo_installer_zip_path }}"

- name: Generate response file via disposable interactive container
  ansible.builtin.command:
    cmd: >-
      {{ playbook_dir }}/../scripts/generate_response_file.sh
      {{ denodo_installer_zip_path }}
      {{ denodo_generated_response_file_path }}
  changed_when: true

- name: Show generated response file path
  ansible.builtin.debug:
    msg: "Generated response file: {{ denodo_generated_response_file_path }}"
