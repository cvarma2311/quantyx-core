---
ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python"

denodo_image_name: denodo-express
denodo_image_tag: 9-local
denodo_container_name: denodo-express-local

denodo_installer_zip_path: "{{ playbook_dir }}/../../installable/denodo-express-install-9-linux64.zip"
denodo_build_context: "{{ playbook_dir }}/../../build-context"
denodo_force_rebuild: false

denodo_runtime_root: "{{ playbook_dir }}/../../runtime"
denodo_runtime_data_dir: "{{ denodo_runtime_root }}/data"
denodo_runtime_logs_dir: "{{ denodo_runtime_root }}/logs"
denodo_runtime_config_dir: "{{ denodo_runtime_root }}/config"
denodo_remove_runtime_on_destroy: false

denodo_published_ports:
  - "9090:9090"
  - "9999:9999"

denodo_verify_ports:
  - 9090
  - 9999
denodo_verify_port_timeout: 120
denodo_verify_required_ports:
  - 9090
denodo_verify_optional_ports:
  - 9999

denodo_volume_mounts:
  - "{{ denodo_runtime_data_dir }}:/opt/denodo/data"
  - "{{ denodo_runtime_logs_dir }}:/opt/denodo/logs"
  - "{{ denodo_runtime_config_dir }}:/opt/denodo/config"

denodo_env:
  TZ: UTC
  DENODO_START_CMD: "/usr/local/bin/start-denodo-auto"

denodo_restart_policy: unless-stopped

# Installer strategy:
# - Auto-detect install script inside zip unless explicitly set.
# - Keep installer execution disabled by default to avoid hanging interactive installers.
denodo_auto_detect_installer_script: true
denodo_installer_script: "denodo-install-9/installer_cli.sh"
denodo_installer_flags: ""
denodo_run_installer_during_build: true
denodo_install_root: "denodo-install-9"
denodo_response_file_path: "{{ playbook_dir }}/../../installable/response_file_9_0.xml"
denodo_generated_response_file_path: "{{ playbook_dir }}/../../installable/response_file_9_0.xml"

# Runtime action values: started | restarted | stopped | absent
denodo_runtime_action: started
